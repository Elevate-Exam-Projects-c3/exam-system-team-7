name: .NET CI / Build Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Lint & Format Check
    runs-on: ubuntu-latest

    # The integration tests hit a real database (real login + seeded users),
    # so CI provides SQL Server as a service container.
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'CI_Only_Passw0rd!'
          MSSQL_PID: 'Developer'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'CI_Only_Passw0rd!' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Overrides appsettings via the ASP.NET Core config hierarchy — zero code change.
      ConnectionStrings__DefaultConnection: 'Server=localhost,1433;Database=ExaminationSystem_Team7_Db;User Id=sa;Password=CI_Only_Passw0rd!;TrustServerCertificate=True;MultipleActiveResultSets=true'
      # The test factory runs with Development (no "Jwt" section in appsettings.json) —
      # the Jwt key is git-tracked in appsettings.Development.json for this learning project.
      ASPNETCORE_ENVIRONMENT: 'Development'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      # The Program.cs seeds only — migrations must be applied explicitly
      # before the tests run (dotnet-ef needs the Design package, already referenced).
      - name: Install EF Core Tools
        run: dotnet tool install --global dotnet-ef --version 10.0.11

      - name: Apply Database Migrations
        # A repo migration may try to recreate tables that already exist in a
        # pre-built database (FirstTestMigration vs the seed-built schema).
        # On a FRESH CI database the full update should succeed; any residual
        # conflict is surfaced but does not fail the job — the tests themselves
        # are the real gate.
        run: dotnet ef database update --project "exam system team 7.csproj" --no-build --configuration Release
        continue-on-error: true

      - name: Check Code Formatting
        run: dotnet format --verify-no-changes --verbosity normal
        continue-on-error: true

      - name: Run Tests
        run: |
          test_projects=$(find . -name "*Test*.csproj" -o -name "*Tests*.csproj")
          if [ -n "$test_projects" ]; then
            echo "Running test projects..."
            dotnet test --no-build --configuration Release --verbosity normal
          else
            echo "No test projects found, skipping test execution."
          fi
