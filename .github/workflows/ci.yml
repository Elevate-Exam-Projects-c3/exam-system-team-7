name: .NET CI / Build Verification

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build, Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --no-restore --configuration Release

      - name: Check Code Formatting
        run: dotnet format --verify-no-changes --verbosity normal
        continue-on-error: true

      - name: Run Tests
        run: |
          test_projects=$(find . -name "*Test*.csproj" -o -name "*Tests*.csproj")
          if [ -n "$test_projects" ]; then
            echo "Running test projects..."
            dotnet test --no-build --configuration Release --verbosity normal
          else
            echo "No test projects found, skipping test execution."
          fi
